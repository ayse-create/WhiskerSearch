<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>WhiskerSearch🐱🔎</title>
  <style>
    /* === MEVCUT STILLER (SADECE GEREKENLER EKLENDİ) === */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden; /* Taşmayı engelle */
    }

    .browser-container {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .demo-warning {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: #ffffff;
      padding: 12px 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      flex-shrink: 0; /* Daralmaması için */
    }

    .browser-header {
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap; /* Mobil için sarma */
    }

    .browser-buttons {
      display: flex;
      gap: 8px;
    }

    .nav-button {
      width: 32px;
      height: 32px;
      border: 1px solid #d0d0d0;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 16px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .nav-button:hover { background: #e8e8e8; }

    .address-bar {
      flex: 1;
      min-width: 120px; /* Mobilde çok küçülmesin */
      background: #f0f0f0;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .address-bar-icon { color: #666; font-size: 14px; flex-shrink: 0; }
    .address-bar input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 6px 0;
      font-size: 13px;
      color: #333;
      outline: none;
      min-width: 50px;
      width: 100%; /* Mobil için */
    }
    .address-bar input::placeholder { color: #999; }

    .browser-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      min-height: 0; /* Flex taşmasını engelle */
    }

    /* === ANA SAYFA (SEARCH) === */
    .search-page {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #fafafa 0%, #ffffff 100%);
      overflow-y: auto; /* Mobilde taşma olursa */
    }
    .search-logo {
      width: 180px;
      max-width: 60%; /* Mobil için */
      height: auto;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounce 2s infinite;
    }
    .search-logo img { width: 100%; height: auto; object-fit: contain; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .search-box {
      display: flex;
      width: 100%;
      max-width: 500px;
      margin-bottom: 30px;
    }
    .search-input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 50px 0 0 50px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
      min-width: 0; /* Mobilde taşmayı engelle */
    }
    .search-input:focus { border-color: #acd1fc; }
    .search-button {
      padding: 14px 28px;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      border: none;
      border-radius: 0 50px 50px 0;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .search-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    /* === ALERT === */
    .alert-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s;
      padding: 20px;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .alert-box {
      background: white;
      border-radius: 12px;
      padding: 40px 30px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.4s;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .alert-icon { font-size: 80px; margin-bottom: 20px; animation: wobble 0.6s; }
    @keyframes wobble { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
    .alert-title { font-size: 28px; font-weight: 700; color: #333; margin-bottom: 10px; }
    .alert-message { font-size: 16px; color: #666; margin-bottom: 30px; line-height: 1.5; }
    .alert-button {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white; border: none; padding: 12px 40px; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s;
    }
    .alert-button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }

    /* === SONUÇLAR (RESULTS) === */
    .results-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: white;
    }
    .result-item {
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      border-left: 4px solid #FFD1E8;
      cursor: pointer;
      transition: all 0.3s;
    }
    .result-item:hover { background: #f0f0f0; transform: translateX(5px); }
    .result-url { font-size: 13px; color: #436691; margin-bottom: 8px; word-break: break-all; }
    .result-title { font-size: 18px; color: #333; font-weight: 600; margin-bottom: 8px; }
    .result-description { font-size: 14px; color: #666; line-height: 1.5; }
    .result-content { flex: 1; }

    /* === SEKMELER (TABS) === */
    .tabs-container {
      display: flex;
      gap: 15px;
      padding: 12px 15px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      overflow-x: auto;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* Firefox */
    }
    .tabs-container::-webkit-scrollbar { display: none; }
    .tab {
      padding: 8px 0;
      border: none;
      background: none;
      color: #666;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tab.active { color: #436691; border-bottom-color: #436691; }
    .tab:hover { color: #333; }

    /* === GÖRSELLER GRİD === */
    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      padding: 15px;
      background: white;
    }
    .image-item {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 3px solid transparent;
      overflow: hidden;
      position: relative;
    }
    .image-item img { width: 100%; height: 100%; object-fit: cover; }
    .image-item:hover { transform: scale(1.05) rotate(-2deg); border-color: #D8C7FF; box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3); }
    .image-item .image-number {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.5); color: white; font-size: 11px;
      padding: 2px 8px; border-radius: 10px; font-family: monospace;
    }
    .image-placeholder { font-size: 50px; opacity: 0.3; }

    /* === VİDEOLAR GRİD === */
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 15px;
      background: white;
    }
    .video-item {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      border-radius: 12px;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      overflow: hidden;
      position: relative;
      border: 3px solid transparent;
    }
    .video-item video { width: 100%; height: 100%; object-fit: cover; }
    .video-item:hover { transform: translateY(-5px) scale(1.02); border-color: #D8C7FF; box-shadow: 0 12px 30px rgba(102, 126, 234, 0.3); }
    .video-play-icon {
      position: absolute; font-size: 48px; color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5); pointer-events: none;
    }
    .video-item .video-number {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.5); color: white; font-size: 11px;
      padding: 2px 8px; border-radius: 10px; font-family: monospace;
    }

    /* === IFRAME KONTEYNERLER (AI, SHOP, CALC) === */
    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 400px; /* Mobil için yeterli yükseklik */
      background: white;
    }
    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block; /* Fazla boşlukları engeller */
    }

    .tab-content {
      display: none;
      flex: 1;
      overflow-y: auto;
      flex-direction: column;
    }
    .tab-content.active { display: flex; }

    /* === HEADER (Sonuç sayfasındaki arama kutusu) === */
    .results-header {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #f9f9f9;
      border-bottom: 1px solid #e0e0e0;
      flex-wrap: wrap;
      gap: 10px;
      flex-shrink: 0;
    }
    .results-header .search-box {
      max-width: 500px;
      margin: 0;
      flex: 1;
      min-width: 180px;
    }
    .results-header .search-box .search-input { max-width: none; }
    .results-header .info-text {
      font-size: 13px;
      color: #999;
      white-space: nowrap;
    }

    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 15px 5px 15px;
      background: white;
      flex-wrap: wrap;
      gap: 10px;
    }
    .grid-header h3 { font-size: 16px; color: #333; }
    .grid-header .count { font-size: 13px; color: #999; }
    .refresh-btn {
      padding: 6px 14px;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white; border: none; border-radius: 8px; cursor: pointer;
      font-weight: 600; transition: all 0.3s; font-size: 13px;
    }
    .refresh-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }

    /* === MOBİL UYUMLULUK İYİLEŞTİRMELERİ === */
    @media (max-width: 600px) {
      .browser-header { padding: 10px; gap: 6px; }
      .nav-button { width: 28px; height: 28px; font-size: 14px; }
      .address-bar { padding: 2px 8px; min-width: 80px; }
      .address-bar input { font-size: 12px; padding: 4px 0; }
      .search-logo { width: 120px; }
      .search-input { padding: 12px 14px; font-size: 14px; }
      .search-button { padding: 12px 18px; font-size: 14px; }
      .alert-box { padding: 30px 20px; }
      .alert-title { font-size: 24px; }
      .tabs-container { gap: 10px; padding: 10px 12px; }
      .tab { font-size: 13px; }
      .images-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 10px; }
      .videos-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 10px; }
      .results-header { padding: 10px; }
      .results-header .search-box { min-width: 140px; }
      .results-header .info-text { font-size: 11px; }
      .result-item { padding: 15px; }
      .result-title { font-size: 16px; }
      .iframe-container { min-height: 300px; }
    }

    @media (max-width: 400px) {
      .search-logo { width: 100px; }
      .search-box { flex-wrap: wrap; }
      .search-input { border-radius: 50px; border-bottom-right-radius: 0; border-bottom-left-radius: 0; }
      .search-button { border-radius: 50px; border-top-left-radius: 0; border-top-right-radius: 0; width: 100%; }
      .images-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
      .videos-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }

    /* Masaüstü görünümü koru */
    @media (min-width: 601px) {
      .browser-header { flex-wrap: nowrap; }
      .results-header .search-box { flex: 1; }
      .iframe-container { min-height: 500px; }
    }
  </style>
</head>
<body>
  <div class="browser-container">
    <div class="demo-warning">
      ⚠️ Bu bir demo/tarayıcı simülasyonudur - Eğlence amaçlıdır
    </div>

    <div class="browser-header">
      <div class="browser-buttons">
        <button class="nav-button" onclick="goBack()" title="Geri">←</button>
        <button class="nav-button" onclick="goForward()" title="İleri">→</button>
        <button class="nav-button" onclick="goHome()" title="Ana Sayfa">↻</button>
      </div>
      <div class="address-bar">
        <span class="address-bar-icon">🔒</span>
        <input type="text" id="addressInput" value="https://ayse-create.github.io/WhiskerSearch" placeholder="URL girin..." onfocus="this.select()" onkeypress="handleAddress(event)" />
      </div>
    </div>

    <div class="browser-content" id="browserContent">
      <!-- Ana Sayfa -->
      <div class="search-page" id="homePage">
        <div class="search-logo">
          <img src="1.png" alt="WhiskerSearch Logo" />
        </div>
        <div class="search-box">
          <input type="text" class="search-input" id="searchInput" placeholder="WhiskerSearch'te ara..." onkeypress="handleSearch(event)" />
          <button class="search-button" onclick="performSearch()">Ara</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Alert -->
  <div class="alert-overlay" id="alertOverlay" style="display: none;">
    <div class="alert-box">
      <div class="alert-icon">🐱</div>
      <div class="alert-title">WhiskerSearch uyarısı!</div>
      <div class="alert-message">Bu arama sonuçları WhiskerSearch tarafından işlenmiştir. Devam etmek için tıklayın.</div>
      <button class="alert-button" onclick="confirmAlert()">Devam Et</button>
    </div>
  </div>

  <!-- whisker_ai_data.js burada yükleniyor (AI sekmesi için gerekli değil ama hata vermemesi için) -->
  <script src="whisker_ai_data.js"></script>
  <script>
    // ================================================================
    // KONFİGÜRASYON
    // ================================================================
    const CONFIG = {
      totalImages: 24,
      totalVideos: 9,
      imagesToShow: 10,
      videosToShow: 5,
      imagePath: 'images/',
      videoPath: 'videos/'
    };

    // ================================================================
    // YARDIMCI FONKSİYONLAR
    // ================================================================
    function getRandomNumbers(count, max) {
      const numbers = [];
      const available = Array.from({ length: max }, (_, i) => i + 1);
      for (let i = 0; i < Math.min(count, max); i++) {
        const randomIndex = Math.floor(Math.random() * available.length);
        numbers.push(available[randomIndex]);
        available.splice(randomIndex, 1);
      }
      return numbers;
    }

    // ================================================================
    // GÖRSEL ve VİDEO OLUŞTURUCULAR
    // ================================================================
    function buildRandomImages() {
      const randomNumbers = getRandomNumbers(CONFIG.imagesToShow, CONFIG.totalImages);
      return `
        <div class="grid-header">
          <h3>🐱 Rastgele Kediler</h3>
          <div>
            <span class="count">${randomNumbers.length} / ${CONFIG.totalImages} görsel</span>
            <button class="refresh-btn" onclick="refreshImages()">🔄 Yenile</button>
          </div>
        </div>
        <div class="images-grid">
          ${randomNumbers.map(num => `
            <div class="image-item" onclick="openImage(${num})" title="Kedi ${num}">
              <img src="${CONFIG.imagePath}${num}.png" alt="Kedi ${num}" loading="lazy"
                   onerror="this.parentElement.innerHTML='<span class=\\'image-placeholder\\'>🐱</span><span class=\\'image-number\\'>#${num}</span>'">
              <span class="image-number">#${num}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function buildRandomVideos() {
      const randomNumbers = getRandomNumbers(CONFIG.videosToShow, CONFIG.totalVideos);
      return `
        <div class="grid-header">
          <h3>🎬 Rastgele Videolar</h3>
          <div>
            <span class="count">${randomNumbers.length} / ${CONFIG.totalVideos} video</span>
            <button class="refresh-btn" onclick="refreshVideos()">🔄 Yenile</button>
          </div>
        </div>
        <div class="videos-grid">
          ${randomNumbers.map(num => `
            <div class="video-item" onclick="openVideo(${num})" title="Video ${num}">
              <video src="${CONFIG.videoPath}${num}.mp4" muted loop preload="metadata"
                     onmouseover="this.play()" onmouseout="this.pause(); this.currentTime=0;"
                     onerror="this.parentElement.innerHTML='<span class=\\'video-play-icon\\'>🎬</span><span class=\\'video-number\\'>#${num}</span>'">
              </video>
              <span class="video-play-icon">▶️</span>
              <span class="video-number">#${num}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function refreshImages() {
      const container = document.getElementById('imagesContainer');
      if (container) container.innerHTML = buildRandomImages();
    }
    function refreshVideos() {
      const container = document.getElementById('videosContainer');
      if (container) container.innerHTML = buildRandomVideos();
    }

    function openImage(num) { window.open(`${CONFIG.imagePath}${num}.png`, '_blank', 'noopener,noreferrer'); }
    function openVideo(num) { window.open(`${CONFIG.videoPath}${num}.mp4`, '_blank', 'noopener,noreferrer'); }

    // ================================================================
    // IFRAME YÜKLEYİCİ (AI, SHOP, CALC)
    // ================================================================
    function loadIframeContent(src, title) {
      return `
        <div style="padding: 10px 15px; background: #f9f9f9; border-bottom: 1px solid #e0e0e0; flex-shrink: 0;">
          <h3 style="font-size: 16px; color: #333;">${title}</h3>
        </div>
        <div class="iframe-container">
          <iframe src="${src}" 
                  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
                  loading="lazy"
                  allow="autoplay; encrypted-media; fullscreen">
          </iframe>
        </div>
      `;
    }

    // ================================================================
    // SONUÇLARI GÖSTER (GÜNCELLENMİŞ - AI IFRAME İLE)
    // ================================================================
    let lastSearchQuery = '';
    let canvaLink = 'https://www.canva.com/design/DAGrke6nXUY/OdOciaHr0CxE1haEmn-IeA/view?utm_content=DAGrke6nXUY&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h31ec2b4051';
    let history = [];
    let historyIndex = -1;
    const ownSites = ['ayse-create.github.io', 'professorcatsearch.com', 'whiskersearch.com'];

    function showResults() {
      const content = document.getElementById('browserContent');
      const query = lastSearchQuery || 'kedi';

      content.innerHTML = `
        <!-- Header with search -->
        <div class="results-header">
          <div class="search-box">
            <input type="text" class="search-input" value="${query}" onkeypress="handleSearch(event)" />
            <button class="search-button" onclick="performSearch()">Ara</button>
          </div>
          <div class="info-text">🐱 ${CONFIG.totalImages} görsel · 🎬 ${CONFIG.totalVideos} video</div>
        </div>

        <!-- Tabs -->
        <div class="tabs-container">
          <button class="tab active" onclick="switchTab('all')">🔍 Tümü</button>
          <button class="tab" onclick="switchTab('images')">🖼️ Görseller</button>
          <button class="tab" onclick="switchTab('videos')">🎬 Videolar</button>
          <button class="tab" onclick="switchTab('shopping')">🛍️ Alışveriş</button>
          <button class="tab" onclick="switchTab('calculator')">🧮 Hesap Makinesi</button>
          <button class="tab" onclick="switchTab('ai')">🤖 WhiskerAI</button>
        </div>

        <!-- İçerikler -->
        <div id="all-content" class="tab-content active">
          <div class="results-container">
            <div style="margin-bottom: 10px; color: #999; font-size: 14px;">Sonuçlar: "${query}" için</div>
            <div class="result-item" onclick="openResult()">
              <div class="result-content">
                <div class="result-url">whiskersearch.com › arama › ${query}</div>
                <div class="result-title">🐱 WhiskerSearch'ün En Özel Seçimi</div>
                <div class="result-description">WhiskerSearch bu sonucu titizlikle seçti!</div>
              </div>
            </div>
            <div class="result-item" onclick="openResult()">
              <div class="result-content">
                <div class="result-url">whiskersearch.com › tavsiye › ${query}</div>
                <div class="result-title">😽 WhiskerSearch'ün Tavsiye Ettiği Sonuç</div>
                <div class="result-description">WhiskerSearch bu sonucu inceledi ve onayladı.</div>
              </div>
            </div>
            <div class="result-item" onclick="openResult()">
              <div class="result-content">
                <div class="result-url">whiskersearch.com › öneri › ${query}</div>
                <div class="result-title">😺 Bir Diğer WhiskerSearch Önerisi</div>
                <div class="result-description">WhiskerSearch bunu sana öneriyor.</div>
              </div>
            </div>
          </div>
        </div>

        <div id="images-content" class="tab-content">
          <div id="imagesContainer">${buildRandomImages()}</div>
        </div>

        <div id="videos-content" class="tab-content">
          <div id="videosContainer">${buildRandomVideos()}</div>
        </div>

        <div id="shopping-content" class="tab-content">
          ${loadIframeContent('https://ayse-create.github.io/WhiskerShopMini/', '🛍️ WhiskerShop')}
        </div>

        <div id="calculator-content" class="tab-content">
          ${loadIframeContent('https://ayse-create.github.io/WhiskerCalcMini', '🧮 WhiskerCalc')}
        </div>

        <div id="ai-content" class="tab-content">
          ${loadIframeContent('https://ayse-create.github.io/WhiskerAI', '🤖 WhiskerAI')}
        </div>
      `;

      // Geçmişe ekle
      history.push({ type: 'results', query: query });
      historyIndex = history.length - 1;
    }

    // ================================================================
    // TAB GEÇİŞİ
    // ================================================================
    function switchTab(tabName) {
      const tabs = document.querySelectorAll('.tab');
      const contents = document.querySelectorAll('.tab-content');
      tabs.forEach(t => t.classList.remove('active'));
      contents.forEach(c => c.classList.remove('active'));

      const tabMap = { 'all': 'Tümü', 'images': 'Görseller', 'videos': 'Videolar', 'shopping': 'Alışveriş', 'calculator': 'Hesap Makinesi', 'ai': 'WhiskerAI' };
      const activeTab = Array.from(tabs).find(t => t.textContent.includes(tabMap[tabName]));
      if (activeTab) activeTab.classList.add('active');

      const content = document.getElementById(`${tabName}-content`);
      if (content) content.classList.add('active');
    }

    // ================================================================
    // GEZİNME FONKSİYONLARI
    // ================================================================
    function handleAddress(event) {
      if (event.key === 'Enter') {
        const input = document.getElementById('addressInput');
        let url = input.value.trim();
        if (!url) return;
        if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
        const isOwn = ownSites.some(site => url.includes(site));
        if (isOwn) loadPage(url);
        else window.open(url, '_blank', 'noopener,noreferrer');
      }
    }

    function loadPage(url) {
      const content = document.getElementById('browserContent');
      content.innerHTML = `<iframe class="page-frame" src="${url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals" style="width:100%;height:100%;border:none;"></iframe>`;
      document.getElementById('addressInput').value = url;
      history.push({ type: 'page', url: url });
      historyIndex = history.length - 1;
    }

    function goHome() {
      const content = document.getElementById('browserContent');
      content.innerHTML = `
        <div class="search-page">
          <div class="search-logo"><img src="1.png" alt="WhiskerSearch Logo" /></div>
          <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="WhiskerSearch'te ara..." onkeypress="handleSearch(event)" />
            <button class="search-button" onclick="performSearch()">Ara</button>
          </div>
        </div>
      `;
      document.getElementById('addressInput').value = 'https://ayse-create.github.io/WhiskerSearch';
      history = [];
      historyIndex = -1;
    }

    function goBack() {
      if (historyIndex > 0) {
        historyIndex--;
        const entry = history[historyIndex];
        if (entry.type === 'results') { lastSearchQuery = entry.query; showResults(); }
        else if (entry.type === 'page') loadPage(entry.url);
      }
    }

    function goForward() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        const entry = history[historyIndex];
        if (entry.type === 'results') { lastSearchQuery = entry.query; showResults(); }
        else if (entry.type === 'page') loadPage(entry.url);
      }
    }

    // ================================================================
    // ARAMA ve ALERT
    // ================================================================
    function handleSearch(event) {
      if (event.key === 'Enter') performSearch();
    }

    function performSearch() {
      const input = document.getElementById('searchInput');
      if (!input) return;
      const query = input.value.trim();
      if (query) {
        lastSearchQuery = query;
        document.getElementById('addressInput').value = `https://ayse-create.github.io/WhiskerSearch/search?q=${encodeURIComponent(query)}`;
        showAlert();
      }
    }

    function showAlert() { document.getElementById('alertOverlay').style.display = 'flex'; }
    function confirmAlert() { document.getElementById('alertOverlay').style.display = 'none'; showResults(); }
    function openResult() { window.open(canvaLink, '_blank', 'noopener,noreferrer'); }

    // ================================================================
    // BAŞLAT
    // ================================================================
    window.onload = function() {
      const addrInput = document.getElementById('addressInput');
      if (addrInput) addrInput.value = 'https://ayse-create.github.io/WhiskerSearch';
      console.log(`🐱 ${CONFIG.totalImages} görsel, 🎬 ${CONFIG.totalVideos} video hazır!`);
      console.log('🤖 WhiskerAI entegre edildi: https://ayse-create.github.io/WhiskerAI');
    };
  </script>
</body>
</html>
