<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>WhiskerSearch🐱🔎</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    .browser-container {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .demo-warning {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: #ffffff;
      padding: 12px 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .browser-header {
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .browser-buttons {
      display: flex;
      gap: 8px;
    }

    .nav-button {
      width: 32px;
      height: 32px;
      border: 1px solid #d0d0d0;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 16px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .nav-button:hover {
      background: #e8e8e8;
    }

    .address-bar {
      flex: 1;
      min-width: 120px;
      background: #f0f0f0;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .address-bar-icon {
      color: #666;
      font-size: 14px;
      flex-shrink: 0;
    }

    .address-bar input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 6px 0;
      font-size: 13px;
      color: #333;
      outline: none;
      min-width: 50px;
      width: 100%;
    }

    .address-bar input::placeholder {
      color: #999;
    }

    .browser-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    /* === ANA SAYFA === */
    .search-page {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #fafafa 0%, #ffffff 100%);
      overflow-y: auto;
    }

    .search-logo {
      width: 220px;
      max-width: 70%;
      height: auto;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounce 2s infinite;
    }

    .search-logo img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* === ARAMA KUTUSU === */
    .search-box {
      display: flex;
      width: 100%;
      max-width: 500px;
      margin-bottom: 30px;
    }

    .search-input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 50px 0 0 50px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
      min-width: 0;
    }

    .search-input:focus {
      border-color: #acd1fc;
    }

    .search-button {
      padding: 14px 28px;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      border: none;
      border-radius: 0 50px 50px 0;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .search-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    /* === ALERT === */
    .alert-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s;
      padding: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .alert-box {
      background: white;
      border-radius: 12px;
      padding: 40px 30px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.4s;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .alert-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: wobble 0.6s;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    .alert-title {
      font-size: 28px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }

    .alert-message {
      font-size: 16px;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .alert-button {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .alert-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    /* === SONUÇLAR === */
    .results-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: white;
    }

    .result-item {
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      border-left: 4px solid #FFD1E8;
      cursor: pointer;
      transition: all 0.3s;
    }

    .result-item:hover {
      background: #f0f0f0;
      transform: translateX(5px);
    }

    .result-url {
      font-size: 13px;
      color: #436691;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .result-title {
      font-size: 18px;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .result-description {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    .result-content {
      flex: 1;
    }

    /* === SEKMELER === */
    .tabs-container {
      display: flex;
      gap: 15px;
      padding: 12px 15px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      overflow-x: auto;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .tabs-container::-webkit-scrollbar {
      display: none;
    }

    .tab {
      padding: 8px 0;
      border: none;
      background: none;
      color: #666;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tab.active {
      color: #436691;
      border-bottom-color: #436691;
    }

    .tab:hover {
      color: #333;
    }

    /* === GÖRSELLER - 2'Lİ SÜTUN === */
    .images-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 15px;
      background: white;
    }

    .image-item {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 3px solid transparent;
      overflow: hidden;
      position: relative;
    }

    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-item:hover {
      transform: scale(1.05) rotate(-2deg);
      border-color: #D8C7FF;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
    }

    .image-item .image-number {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-family: monospace;
    }

    .image-placeholder {
      font-size: 50px;
      opacity: 0.3;
    }

    /* === VİDEOLAR - TEK SÜTUN === */
    .videos-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 15px;
      background: white;
    }

    .video-item {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      border-radius: 12px;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      overflow: hidden;
      position: relative;
      border: 3px solid transparent;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .video-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-item:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: #D8C7FF;
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.3);
    }

    .video-play-icon {
      position: absolute;
      font-size: 48px;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .video-item .video-number {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-family: monospace;
    }

    /* === IFRAME SAYFALARI - SADECE GERİ BUTONU === */
    .iframe-fullscreen {
      flex: 1;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .iframe-fullscreen .iframe-nav {
      padding: 10px 15px;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .iframe-fullscreen .iframe-nav .back-btn {
      padding: 6px 16px;
      background: #e8e8e8;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      color: #333;
      transition: all 0.2s;
    }

    .iframe-fullscreen .iframe-nav .back-btn:hover {
      background: #d0d0d0;
    }

    .iframe-fullscreen .iframe-nav .iframe-title {
      font-size: 14px;
      color: #666;
      font-weight: 500;
    }

    .iframe-fullscreen iframe {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
      min-height: 400px;
    }

    .tab-content {
      display: none;
      flex: 1;
      overflow-y: auto;
      flex-direction: column;
    }

    .tab-content.active {
      display: flex;
    }

    /* === HEADER === */
    .results-header {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #f9f9f9;
      border-bottom: 1px solid #e0e0e0;
      flex-wrap: wrap;
      gap: 10px;
      flex-shrink: 0;
    }

    .results-header .search-box {
      max-width: 500px;
      margin: 0;
      flex: 1;
      min-width: 180px;
    }

    .results-header .search-box .search-input {
      max-width: none;
    }

    .results-header .info-text {
      font-size: 13px;
      color: #999;
      white-space: nowrap;
    }

    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 15px 5px 15px;
      background: white;
      flex-wrap: wrap;
      gap: 10px;
    }

    .grid-header h3 {
      font-size: 16px;
      color: #333;
    }

    .grid-header .count {
      font-size: 13px;
      color: #999;
    }

    .refresh-btn {
      padding: 6px 14px;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 13px;
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    /* IFRAME MODU - Arama barı gizli */
    .iframe-mode .browser-header {
      display: none !important;
    }

    /* === MOBİL === */
    @media (max-width: 600px) {
      .browser-header {
        padding: 10px;
        gap: 6px;
      }
      
      .nav-button {
        width: 28px;
        height: 28px;
        font-size: 14px;
      }
      
      .address-bar {
        padding: 2px 8px;
        min-width: 80px;
      }
      
      .address-bar input {
        font-size: 12px;
        padding: 4px 0;
      }
      
      .search-logo {
        width: 160px;
      }
      
      .search-input {
        padding: 12px 14px;
        font-size: 14px;
      }
      
      .search-button {
        padding: 12px 18px;
        font-size: 14px;
      }
      
      .alert-box {
        padding: 30px 20px;
      }
      
      .alert-title {
        font-size: 24px;
      }
      
      .tabs-container {
        gap: 10px;
        padding: 10px 12px;
      }
      
      .tab {
        font-size: 13px;
      }
      
      .images-grid {
        gap: 10px;
        padding: 10px;
      }
      
      .videos-grid {
        gap: 15px;
        padding: 10px;
      }
      
      .video-item {
        max-width: 100%;
      }
      
      .results-header {
        padding: 10px;
      }
      
      .results-header .search-box {
        min-width: 140px;
      }
      
      .results-header .info-text {
        font-size: 11px;
      }
      
      .result-item {
        padding: 15px;
      }
      
      .result-title {
        font-size: 16px;
      }
      
      .iframe-fullscreen iframe {
        min-height: 300px;
      }
    }

    @media (max-width: 400px) {
      .search-logo {
        width: 120px;
      }
      
      .images-grid {
        gap: 8px;
        padding: 8px;
      }
      
      .iframe-fullscreen iframe {
        min-height: 250px;
      }
    }

    /* Masaüstü */
    @media (min-width: 601px) {
      .browser-header {
        flex-wrap: nowrap;
      }
      
      .results-header .search-box {
        flex: 1;
      }
      
      .iframe-fullscreen iframe {
        min-height: 500px;
      }
    }
  </style>
</head>
<body>
  <div class="browser-container" id="browserContainer">
    <div class="demo-warning">
      ⚠️ Bu bir demo/tarayıcı simülasyonudur - Eğlence amaçlıdır
    </div>

    <div class="browser-header" id="mainHeader">
      <div class="browser-buttons">
        <button class="nav-button" onclick="goBack()" title="Geri">←</button>
        <button class="nav-button" onclick="goForward()" title="İleri">→</button>
        <button class="nav-button" onclick="goHome()" title="Ana Sayfa">↻</button>
      </div>
      <div class="address-bar">
        <span class="address-bar-icon">🔒</span>
        <input type="text" id="addressInput" value="https://ayse-create.github.io/WhiskerSearch" placeholder="URL girin..." onfocus="this.select()" onkeypress="handleAddress(event)" />
      </div>
    </div>

    <div class="browser-content" id="browserContent">
      <div class="search-page" id="homePage">
        <div class="search-logo">
          <img src="1.png" alt="WhiskerSearch Logo" />
        </div>
        <div class="search-box">
          <input type="text" class="search-input" id="searchInput" placeholder="WhiskerSearch'te ara..." onkeypress="handleSearch(event)" />
          <button class="search-button" onclick="performSearch()">Ara</button>
        </div>
      </div>
    </div>
  </div>

  <div class="alert-overlay" id="alertOverlay" style="display: none;">
    <div class="alert-box">
      <div class="alert-icon">🐱</div>
      <div class="alert-title">WhiskerSearch uyarısı!</div>
      <div class="alert-message">Bu arama sonuçları WhiskerSearch tarafından işlenmiştir. Devam etmek için tıklayın.</div>
      <button class="alert-button" onclick="confirmAlert()">Devam Et</button>
    </div>
  </div>

  <script>
    // ================================================================
    // KONFİGÜRASYON
    // ================================================================
    var CONFIG = {
      totalImages: 24,
      totalVideos: 9,
      imagesToShow: 10,
      videosToShow: 5,
      imagePath: 'images/',
      videoPath: 'videos/'
    };

    var lastSearchQuery = '';
    var canvaLink = 'https://www.canva.com/design/DAGrke6nXUY/OdOciaHr0CxE1haEmn-IeA/view?utm_content=DAGrke6nXUY&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h31ec2b4051';
    var history = [];
    var historyIndex = -1;
    var ownSites = ['ayse-create.github.io', 'professorcatsearch.com', 'whiskersearch.com'];

    // ================================================================
    // YARDIMCI FONKSİYONLAR
    // ================================================================
    function getRandomNumbers(count, max) {
      var numbers = [];
      var available = [];
      for (var i = 1; i <= max; i++) {
        available.push(i);
      }
      for (var j = 0; j < Math.min(count, max); j++) {
        var randomIndex = Math.floor(Math.random() * available.length);
        numbers.push(available[randomIndex]);
        available.splice(randomIndex, 1);
      }
      return numbers;
    }

    // ================================================================
    // GÖRSEL ve VİDEO OLUŞTURUCULAR
    // ================================================================
    function buildRandomImages() {
      var randomNumbers = getRandomNumbers(CONFIG.imagesToShow, CONFIG.totalImages);
      var html = '<div class="grid-header"><h3>🐱 Rastgele Kediler</h3><div><span class="count">' + randomNumbers.length + ' / ' + CONFIG.totalImages + ' görsel</span><button class="refresh-btn" onclick="refreshImages()">🔄 Yenile</button></div></div><div class="images-grid">';
      for (var i = 0; i < randomNumbers.length; i++) {
        var num = randomNumbers[i];
        html += '<div class="image-item" onclick="openImage(' + num + ')" title="Kedi ' + num + '">';
        html += '<img src="' + CONFIG.imagePath + num + '.png" alt="Kedi ' + num + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<span class=\\"image-placeholder\\">🐱</span><span class=\\"image-number\\">#' + num + '</span>\'">';
        html += '<span class="image-number">#' + num + '</span></div>';
      }
      html += '</div>';
      return html;
    }

    function buildRandomVideos() {
      var randomNumbers = getRandomNumbers(CONFIG.videosToShow, CONFIG.totalVideos);
      var html = '<div class="grid-header"><h3>🎬 Rastgele Videolar</h3><div><span class="count">' + randomNumbers.length + ' / ' + CONFIG.totalVideos + ' video</span><button class="refresh-btn" onclick="refreshVideos()">🔄 Yenile</button></div></div><div class="videos-grid">';
      for (var i = 0; i < randomNumbers.length; i++) {
        var num = randomNumbers[i];
        html += '<div class="video-item" onclick="openVideo(' + num + ')" title="Video ' + num + '">';
        html += '<video src="' + CONFIG.videoPath + num + '.mp4" muted loop preload="metadata" onmouseover="this.play()" onmouseout="this.pause(); this.currentTime=0;" onerror="this.parentElement.innerHTML=\'<span class=\\"video-play-icon\\">🎬</span><span class=\\"video-number\\">#' + num + '</span>\'"></video>';
        html += '<span class="video-play-icon">▶️</span>';
        html += '<span class="video-number">#' + num + '</span></div>';
      }
      html += '</div>';
      return html;
    }

    function refreshImages() {
      var container = document.getElementById('imagesContainer');
      if (container) {
        container.innerHTML = buildRandomImages();
      }
    }

    function refreshVideos() {
      var container = document.getElementById('videosContainer');
      if (container) {
        container.innerHTML = buildRandomVideos();
      }
    }

    function openImage(num) {
      window.open(CONFIG.imagePath + num + '.png', '_blank', 'noopener,noreferrer');
    }

    function openVideo(num) {
      window.open(CONFIG.videoPath + num + '.mp4', '_blank', 'noopener,noreferrer');
    }

    // ================================================================
    // IFRAME İÇERİĞİ - SADECE GERİ BUTONU
    // ================================================================
    function loadIframeFullscreen(src, title) {
      return '<div class="iframe-fullscreen"><div class="iframe-nav"><button class="back-btn" onclick="goHome()">← Geri</button><span class="iframe-title">' + title + '</span></div><iframe src="' + src + '" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals" loading="lazy" allow="autoplay; encrypted-media; fullscreen"></iframe></div>';
    }

    // ================================================================
    // IFRAME MODU KONTROLÜ
    // ================================================================
    function checkIframeMode() {
      var container = document.getElementById('browserContainer');
      var activeContent = document.querySelector('.tab-content.active');
      if (activeContent) {
        var hasIframe = activeContent.querySelector('.iframe-fullscreen');
        if (hasIframe) {
          container.classList.add('iframe-mode');
        } else {
          container.classList.remove('iframe-mode');
        }
      }
    }

    // ================================================================
    // SONUÇLARI GÖSTER
    // ================================================================
    function showResults() {
      var content = document.getElementById('browserContent');
      var query = lastSearchQuery || 'kedi';

      var resultsHTML = '<div class="results-container"><div style="margin-bottom: 10px; color: #999; font-size: 14px;">Sonuçlar: "' + query + '" için</div>';
      
      // Ana sonuç
      resultsHTML += '<div class="result-item" onclick="openResult()"><div class="result-content"><div class="result-url">whiskersearch.com › arama › ' + query + '</div><div class="result-title">🐱 WhiskerSearch\'ün En Özel Seçimi</div><div class="result-description">WhiskerSearch bu sonucu titizlikle seçti!</div></div></div>';
      
      // Whisker siteleri
      var sites = [
        { name: 'WhiskerShop', url: 'https://ayse-create.github.io/WhiskerShopMini', icon: '🛍️', desc: 'Kedi alışveriş marketi' },
        { name: 'WhiskerCalc', url: 'https://ayse-create.github.io/WhiskerCalcMini', icon: '🧮', desc: 'Kedi hesap makinesi' },
        { name: 'WhiskerAI', url: 'https://ayse-create.github.io/WhiskerAI', icon: '🤖', desc: 'Yapay zeka asistanı' },
        { name: 'WhiskerAirport', url: 'https://ayse-create.github.io/WhiskerAirport', icon: '✈️', desc: 'Kedi havaalanı' },
        { name: 'WhiskerStagram', url: 'https://ayse-create.github.io/WhiskerStagram', icon: '📸', desc: 'Kedi sosyal medyası' }
      ];

      for (var i = 0; i < sites.length; i++) {
        var site = sites[i];
        resultsHTML += '<div class="result-item" onclick="window.open(\'' + site.url + '\', \'_blank\', \'noopener,noreferrer\')"><div class="result-content"><div class="result-url">' + site.url.replace('https://', '') + '</div><div class="result-title">' + site.icon + ' ' + site.name + '</div><div class="result-description">' + site.desc + '</div></div></div>';
      }

      resultsHTML += '</div>';

      content.innerHTML = 
        '<div class="results-header"><div class="search-box"><input type="text" class="search-input" value="' + query + '" onkeypress="handleSearch(event)" /><button class="search-button" onclick="performSearch()">Ara</button></div><div class="info-text">🐱 ' + CONFIG.totalImages + ' görsel · 🎬 ' + CONFIG.totalVideos + ' video</div></div>' +
        '<div class="tabs-container">' +
          '<button class="tab active" onclick="switchTab(\'all\')">🔍 Tümü</button>' +
          '<button class="tab" onclick="switchTab(\'images\')">🖼️ Görseller</button>' +
          '<button class="tab" onclick="switchTab(\'videos\')">🎬 Videolar</button>' +
          '<button class="tab" onclick="switchTab(\'shopping\')">🛍️ Alışveriş</button>' +
          '<button class="tab" onclick="switchTab(\'calculator\')">🧮 Hesap Makinesi</button>' +
          '<button class="tab" onclick="switchTab(\'ai\')">🤖 AI Modu</button>' +
        '</div>' +
        '<div id="all-content" class="tab-content active">' + resultsHTML + '</div>' +
        '<div id="images-content" class="tab-content"><div id="imagesContainer">' + buildRandomImages() + '</div></div>' +
        '<div id="videos-content" class="tab-content"><div id="videosContainer">' + buildRandomVideos() + '</div></div>' +
        '<div id="shopping-content" class="tab-content">' + loadIframeFullscreen('https://ayse-create.github.io/WhiskerShopMini', '🛍️ WhiskerShop') + '</div>' +
        '<div id="calculator-content" class="tab-content">' + loadIframeFullscreen('https://ayse-create.github.io/WhiskerCalcMini', '🧮 WhiskerCalc') + '</div>' +
        '<div id="ai-content" class="tab-content">' + loadIframeFullscreen('https://ayse-create.github.io/WhiskerAI', '🤖 WhiskerAI') + '</div>';

      history.push({ type: 'results', query: query });
      historyIndex = history.length - 1;

      // Iframe modunda header'ı gizle
      checkIframeMode();
    }

    // ================================================================
    // TAB GEÇİŞİ
    // ================================================================
    function switchTab(tabName) {
      var tabs = document.querySelectorAll('.tab');
      var contents = document.querySelectorAll('.tab-content');
      
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove('active');
      }
      for (var j = 0; j < contents.length; j++) {
        contents[j].classList.remove('active');
      }

      var tabMap = { 
        'all': 'Tümü', 
        'images': 'Görseller', 
        'videos': 'Videolar', 
        'shopping': 'Alışveriş', 
        'calculator': 'Hesap Makinesi', 
        'ai': 'AI Modu' 
      };
      
      var activeTab = null;
      var allTabs = document.querySelectorAll('.tab');
      for (var k = 0; k < allTabs.length; k++) {
        if (allTabs[k].textContent.includes(tabMap[tabName])) {
          activeTab = allTabs[k];
          break;
        }
      }
      if (activeTab) {
        activeTab.classList.add('active');
      }

      var content = document.getElementById(tabName + '-content');
      if (content) {
        content.classList.add('active');
      }

      checkIframeMode();
    }

    // ================================================================
    // GEZİNME FONKSİYONLARI
    // ================================================================
    function handleAddress(event) {
      if (event.key === 'Enter') {
        var input = document.getElementById('addressInput');
        var url = input.value.trim();
        if (!url) return;
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        var isOwn = false;
        for (var i = 0; i < ownSites.length; i++) {
          if (url.includes(ownSites[i])) {
            isOwn = true;
            break;
          }
        }
        if (isOwn) {
          loadPage(url);
        } else {
          window.open(url, '_blank', 'noopener,noreferrer');
        }
      }
    }

    function loadPage(url) {
      var content = document.getElementById('browserContent');
      content.innerHTML = '<iframe class="page-frame" src="' + url + '" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals" style="width:100%;height:100%;border:none;"></iframe>';
      document.getElementById('addressInput').value = url;
      history.push({ type: 'page', url: url });
      historyIndex = history.length - 1;
    }

    function goHome() {
      var content = document.getElementById('browserContent');
      content.innerHTML = '<div class="search-page"><div class="search-logo"><img src="1.png" alt="WhiskerSearch Logo" /></div><div class="search-box"><input type="text" class="search-input" id="searchInput" placeholder="WhiskerSearch\'te ara..." onkeypress="handleSearch(event)" /><button class="search-button" onclick="performSearch()">Ara</button></div></div>';
      document.getElementById('addressInput').value = 'https://ayse-create.github.io/WhiskerSearch';
      history = [];
      historyIndex = -1;
      document.getElementById('browserContainer').classList.remove('iframe-mode');
    }

    function goBack() {
      if (historyIndex > 0) {
        historyIndex--;
        var entry = history[historyIndex];
        if (entry.type === 'results') {
          lastSearchQuery = entry.query;
          showResults();
        } else if (entry.type === 'page') {
          loadPage(entry.url);
        }
      }
    }

    function goForward() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        var entry = history[historyIndex];
        if (entry.type === 'results') {
          lastSearchQuery = entry.query;
          showResults();
        } else if (entry.type === 'page') {
          loadPage(entry.url);
        }
      }
    }

    // ================================================================
    // ARAMA ve ALERT
    // ================================================================
    function handleSearch(event) {
      if (event.key === 'Enter') {
        performSearch();
      }
    }

    function performSearch() {
      var input = document.getElementById('searchInput');
      if (!input) return;
      var query = input.value.trim();
      if (query) {
        lastSearchQuery = query;
        document.getElementById('addressInput').value = 'https://ayse-create.github.io/WhiskerSearch/search?q=' + encodeURIComponent(query);
        showAlert();
      }
    }

    function showAlert() {
      document.getElementById('alertOverlay').style.display = 'flex';
    }

    function confirmAlert() {
      document.getElementById('alertOverlay').style.display = 'none';
      showResults();
    }

    function openResult() {
      window.open(canvaLink, '_blank', 'noopener,noreferrer');
    }

    // ================================================================
    // BAŞLAT
    // ================================================================
    window.onload = function() {
      var addrInput = document.getElementById('addressInput');
      if (addrInput) {
        addrInput.value = 'https://ayse-create.github.io/WhiskerSearch';
      }
      console.log('🐱 WhiskerSearch hazır!');
    };
  </script>
</body>
</html>
