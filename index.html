<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhiskerSearch🐱🔎</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .browser-container {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .demo-warning {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: #ffffff;
      padding: 12px 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .browser-header {
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .browser-buttons {
      display: flex;
      gap: 8px;
    }

    .nav-button {
      width: 32px;
      height: 32px;
      border: 1px solid #d0d0d0;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 16px;
      transition: all 0.2s;
    }

    .nav-button:hover {
      background: #e8e8e8;
    }

    .address-bar {
      flex: 1;
      background: #f0f0f0;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .address-bar-icon {
      color: #666;
      font-size: 14px;
      flex-shrink: 0;
    }

    .address-bar input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 6px 0;
      font-size: 13px;
      color: #333;
      outline: none;
      min-width: 50px;
    }

    .address-bar input::placeholder {
      color: #999;
    }

    .browser-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .search-page {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #fafafa 0%, #ffffff 100%);
    }

    .search-logo {
      width: 180px;
      height: 180px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounce 2s infinite;
    }

    .search-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .search-box {
      display: flex;
      width: 100%;
      max-width: 500px;
      margin-bottom: 30px;
    }

    .search-input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 50px 0 0 50px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-input:focus {
      border-color: #acd1fc;
    }

    .search-button {
      padding: 14px 28px;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      border: none;
      border-radius: 0 50px 50px 0;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .search-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .alert-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .alert-box {
      background: white;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.4s;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .alert-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: wobble 0.6s;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    .alert-title {
      font-size: 28px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }

    .alert-message {
      font-size: 16px;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .alert-button {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .alert-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .results-container {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: white;
    }

    .result-item {
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      border-left: 4px solid #FFD1E8;
      cursor: pointer;
      transition: all 0.3s;
    }

    .result-item:hover {
      background: #f0f0f0;
      transform: translateX(5px);
    }

    .result-url {
      font-size: 13px;
      color: #436691;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 18px;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .result-description {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    .result-content {
      flex: 1;
    }

    .ai-chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: white;
      padding: 20px 30px;
    }

    .ai-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
      max-height: 400px;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
    }

    .message.ai .message-bubble {
      background: #f0f0f0;
      color: #333;
    }

    .ai-input-area {
      display: flex;
      gap: 10px;
      border-top: 1px solid #e0e0e0;
      padding-top: 15px;
    }

    .ai-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .ai-input:focus {
      border-color: #D8C7FF;
    }

    .ai-send-button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .ai-send-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .tabs-container {
      display: flex;
      gap: 30px;
      padding: 15px 30px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      overflow-x: auto;
    }

    .tab {
      padding: 8px 0;
      border: none;
      background: none;
      color: #666;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .tab.active {
      color: #436691;
      border-bottom-color: #436691;
    }

    .tab:hover {
      color: #333;
    }

    /* ============================================================ */
    /* 📸 GÖRSELLER GRİD - RANDOM 10 TANE */
    /* ============================================================ */
    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      padding: 20px 30px;
      background: white;
    }

    .image-item {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 3px solid transparent;
      overflow: hidden;
      position: relative;
    }

    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-item:hover {
      transform: scale(1.05) rotate(-2deg);
      border-color: #D8C7FF;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
    }

    .image-item .image-number {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-family: monospace;
    }

    .image-placeholder {
      font-size: 50px;
      opacity: 0.3;
    }

    /* ============================================================ */
    /* 🎬 VİDEOLAR GRİD - RANDOM 5 TANE */
    /* ============================================================ */
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px 30px;
      background: white;
    }

    .video-item {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      border-radius: 12px;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      overflow: hidden;
      position: relative;
      border: 3px solid transparent;
    }

    .video-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-item:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: #D8C7FF;
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.3);
    }

    .video-play-icon {
      position: absolute;
      font-size: 48px;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .video-item .video-number {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-family: monospace;
    }

    /* ============================================================ */
    /* 🛍️ ALIŞVERİŞ */
    /* ============================================================ */
    .shop-iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 500px;
    }

    .shop-iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      min-height: 500px;
    }

    .tab-content {
      display: none;
      flex: 1;
      overflow-y: auto;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
    }

    .ai-chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 15px;
    }

    .ai-chat-header h2 {
      font-size: 20px;
      color: #333;
      font-weight: 600;
    }

    .new-chat-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 14px;
    }

    .new-chat-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .chat-history-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 0;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      padding: 6px 12px;
      background: #f0f0f0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: #333;
      transition: all 0.2s;
      border: 1px solid #e0e0e0;
    }

    .history-item:hover {
      background: #e0e0e0;
      border-color: #D8C7FF;
    }

    .history-item.active {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
      border-color: #D8C7FF;
    }

    .no-history {
      color: #999;
      font-size: 14px;
      padding: 10px 0;
    }

    .refresh-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 13px;
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px 5px 30px;
      background: white;
    }

    .grid-header h3 {
      font-size: 16px;
      color: #333;
    }

    .grid-header .count {
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="browser-container">
    <div class="demo-warning">
      ⚠️ Bu bir demo/tarayıcı simülasyonudur - Eğlence amaçlıdır
    </div>

    <div class="browser-header">
      <div class="browser-buttons">
        <button class="nav-button" onclick="goBack()" title="Geri">←</button>
        <button class="nav-button" onclick="goForward()" title="İleri">→</button>
        <button class="nav-button" onclick="goHome()" title="Ana Sayfa">↻</button>
      </div>
      <div class="address-bar">
        <span class="address-bar-icon">🔒</span>
        <input type="text" id="addressInput" value="https://ayse-create.github.io/WhiskerSearch" placeholder="URL girin..." onfocus="this.select()" onkeypress="handleAddress(event)" />
      </div>
    </div>

    <div class="browser-content" id="browserContent">
      <div class="search-page">
        <div class="search-logo">
          <img src="1.png" alt="WhiskerSearch Logo" />
        </div>
        <div class="search-box">
          <input type="text" class="search-input" id="searchInput" placeholder="WhiskerSearch'te ara..." onkeypress="handleSearch(event)" />
          <button class="search-button" onclick="performSearch()">Ara</button>
        </div>
      </div>
    </div>
  </div>

  <div class="alert-overlay" id="alertOverlay" style="display: none;">
    <div class="alert-box">
      <div class="alert-icon">🐱</div>
      <div class="alert-title">WhiskerSearch uyarısı!</div>
      <div class="alert-message">Bu arama sonuçları WhiskerSearch tarafından işlenmiştir. Devam etmek için tıklayın.</div>
      <button class="alert-button" onclick="confirmAlert()">Devam Et</button>
    </div>
  </div>

  <script src="whisker_ai_data.js"></script>

  <script>
    // ================================================================
    // ⚙️ KONFİGÜRASYON
    // ================================================================
    const CONFIG = {
      totalImages: 24,      // 1.png'den 24.png'ye
      totalVideos: 9,       // 1.mp4'den 9.mp4'ye
      imagesToShow: 10,     // Her seferinde 10 görsel göster
      videosToShow: 5,      // Her seferinde 5 video göster
      imagePath: 'images/', // Görsel klasörü
      videoPath: 'videos/'  // Video klasörü
    };

    // ================================================================
    // 🎲 RANDOM SAYI ÜRETİCİ
    // ================================================================
    function getRandomNumbers(count, max) {
      const numbers = [];
      const available = Array.from({ length: max }, (_, i) => i + 1);
      
      for (let i = 0; i < Math.min(count, max); i++) {
        const randomIndex = Math.floor(Math.random() * available.length);
        numbers.push(available[randomIndex]);
        available.splice(randomIndex, 1);
      }
      
      return numbers;
    }

    // ================================================================
    // 📸 RANDOM GÖRSELLERİ OLUŞTUR
    // ================================================================
    function buildRandomImages() {
      const randomNumbers = getRandomNumbers(CONFIG.imagesToShow, CONFIG.totalImages);
      
      return `
        <div class="grid-header">
          <h3>🐱 Rastgele Kediler</h3>
          <div>
            <span class="count">${randomNumbers.length} / ${CONFIG.totalImages} görsel</span>
            <button class="refresh-btn" onclick="refreshImages()">🔄 Yenile</button>
          </div>
        </div>
        <div class="images-grid">
          ${randomNumbers.map(num => `
            <div class="image-item" onclick="openImage(${num})" title="Kedi ${num}">
              <img src="${CONFIG.imagePath}${num}.png" 
                   alt="Kedi ${num}" 
                   loading="lazy"
                   onerror="this.parentElement.innerHTML='<span class=\\'image-placeholder\\'>🐱</span><span class=\\'image-number\\'>#${num}</span>'">
              <span class="image-number">#${num}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ================================================================
    // 🎬 RANDOM VİDEOLARI OLUŞTUR
    // ================================================================
    function buildRandomVideos() {
      const randomNumbers = getRandomNumbers(CONFIG.videosToShow, CONFIG.totalVideos);
      
      return `
        <div class="grid-header">
          <h3>🎬 Rastgele Videolar</h3>
          <div>
            <span class="count">${randomNumbers.length} / ${CONFIG.totalVideos} video</span>
            <button class="refresh-btn" onclick="refreshVideos()">🔄 Yenile</button>
          </div>
        </div>
        <div class="videos-grid">
          ${randomNumbers.map(num => `
            <div class="video-item" onclick="openVideo(${num})" title="Video ${num}">
              <video src="${CONFIG.videoPath}${num}.mp4" 
                     muted 
                     loop 
                     preload="metadata"
                     onmouseover="this.play()"
                     onmouseout="this.pause(); this.currentTime=0;"
                     onerror="this.parentElement.innerHTML='<span class=\\'video-play-icon\\'>🎬</span><span class=\\'video-number\\'>#${num}</span>'">
              </video>
              <span class="video-play-icon">▶️</span>
              <span class="video-number">#${num}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ================================================================
    // 🔄 YENİLEME FONKSİYONLARI
    // ================================================================
    function refreshImages() {
      const container = document.getElementById('imagesContainer');
      if (container) {
        container.innerHTML = buildRandomImages();
      }
    }

    function refreshVideos() {
      const container = document.getElementById('videosContainer');
      if (container) {
        container.innerHTML = buildRandomVideos();
      }
    }

    // ================================================================
    // 🖱️ TIKLAMA İŞLEMLERİ
    // ================================================================
    function openImage(num) {
      const url = `${CONFIG.imagePath}${num}.png`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    function openVideo(num) {
      const url = `${CONFIG.videoPath}${num}.mp4`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    // ================================================================
    // 🏪 ALIŞVERİŞ
    // ================================================================
    function loadShop() {
      return `
        <div class="shop-iframe-container">
          <iframe src="https://ayse-create.github.io/WhiskerShopMini" 
                  style="width:100%; height:100%; min-height:500px; border:none;"
                  sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
                  loading="lazy"
                  allow="autoplay; encrypted-media">
          </iframe>
        </div>
      `;
    }

    // ================================================================
    // 📊 SONUÇLARI GÖSTER (GÜNCELLENMİŞ)
    // ================================================================
    let lastSearchQuery = '';
    let canvaLink = 'https://www.canva.com/design/DAGrke6nXUY/OdOciaHr0CxE1haEmn-IeA/view?utm_content=DAGrke6nXUY&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h31ec2b4051';
    let history = [];
    let historyIndex = -1;
    const ownSites = ['ayse-create.github.io', 'professorcatsearch.com', 'whiskersearch.com'];

    function showResults() {
      const content = document.getElementById('browserContent');
      const query = lastSearchQuery || 'kedi';

      content.innerHTML = `
        <div style="display: flex; align-items: center; padding: 20px 30px; background: #f9f9f9; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; gap: 10px;">
          <div class="search-box" style="max-width: 500px; margin: 0; flex: 1;">
            <input type="text" class="search-input" value="${query}" onkeypress="handleSearch(event)" style="max-width: none;" />
            <button class="search-button" onclick="performSearch()">Ara</button>
          </div>
          <div style="font-size: 13px; color: #999;">
            🐱 ${CONFIG.totalImages} görsel · 🎬 ${CONFIG.totalVideos} video
          </div>
        </div>

        <div class="tabs-container">
          <button class="tab active" onclick="switchTab('all')">🔍 Tümü</button>
          <button class="tab" onclick="switchTab('images')">🖼️ Görseller</button>
          <button class="tab" onclick="switchTab('videos')">🎬 Videolar</button>
          <button class="tab" onclick="switchTab('shopping')">🛍️ Alışveriş</button>
          <button class="tab" onclick="switchTab('ai')">✨ AI Modu</button>
        </div>

        <div id="all-content" class="tab-content active">
          <div class="results-container">
            <div style="margin-bottom: 10px; color: #999; font-size: 14px;">Sonuçlar: "${query}" için</div>
            <div class="result-item" onclick="openResult()">
              <div class="result-content">
                <div class="result-url">whiskersearch.com › arama › ${query}</div>
                <div class="result-title">🐱 WhiskerSeearch'ün En Özel Seçimi</div>
                <div class="result-description">WhiskerSearch bu sonucu titizlikle seçti!</div>
              </div>
            </div>
            <div class="result-item" onclick="openResult()">
              <div class="result-content">
                <div class="result-url">whiskersearch.com › tavsiye › ${query}</div>
                <div class="result-title">😽WhiskerSearch'ün Tavsiye Ettiği Sonuç"</div>
                <div class="result-description">WhiskerSearch bu sonucu inceledi ve onayladı.</div>
              </div>
            </div>
            <div class="result-item" onclick="openResult()">
              <div class="result-content">
                <div class="result-url">whiskersearch.com › oyuncak › ${query}</div>
                <div class="result-title">😺 Bir Diğer WhiskerSearch Önerisi</div>
                <div class="result-description">WhiskerSearch bunu sana öneriyor.</div>
              </div>
            </div>
          </div>
        </div>

        <div id="images-content" class="tab-content">
          <div id="imagesContainer">
            ${buildRandomImages()}
          </div>
        </div>

        <div id="videos-content" class="tab-content">
          <div id="videosContainer">
            ${buildRandomVideos()}
          </div>
        </div>

        <div id="shopping-content" class="tab-content">
          ${loadShop()}
        </div>

        <div id="ai-content" class="tab-content">
          <div class="ai-chat-container">
            <div class="ai-chat-header">
              <h2>🤖 WhiskerAI</h2>
              <div>
                <button class="new-chat-btn" onclick="newChat()">➕ Yeni Sohbet</button>
              </div>
            </div>
            <div id="chatHistoryList" class="chat-history-list"></div>
            <div class="ai-messages" id="aiMessages"></div>
            <div class="ai-input-area">
              <input type="text" class="ai-input" id="aiInput" placeholder="Bir soru sor..." onkeypress="handleAIMessage(event)" />
              <button class="ai-send-button" onclick="sendAIMessage()">Gönder</button>
            </div>
          </div>
        </div>
      `;

      history.push({ type: 'results', query: query });
      historyIndex = history.length - 1;

      loadChats();
      if (Object.keys(chats).length === 0) {
        newChat();
      } else {
        const keys = Object.keys(chats);
        loadChat(keys[keys.length - 1]);
      }
      updateHistoryUI();

      setTimeout(() => {
        const aiInput = document.getElementById('aiInput');
        if (aiInput) aiInput.focus();
      }, 100);
    }

    // ================================================================
    // 🔄 TAB GEÇİŞİ (GÜNCELLENMİŞ)
    // ================================================================
    function switchTab(tabName) {
      const tabs = document.querySelectorAll('.tab');
      const contents = document.querySelectorAll('.tab-content');
      tabs.forEach(t => t.classList.remove('active'));
      contents.forEach(c => c.classList.remove('active'));
      
      const tabMap = { 
        'all': 'Tümü', 
        'images': 'Görseller', 
        'videos': 'Videolar', 
        'shopping': 'Alışveriş', 
        'ai': 'AI Modu' 
      };
      
      const activeTab = Array.from(tabs).find(t => t.textContent.includes(tabMap[tabName]));
      if (activeTab) activeTab.classList.add('active');
      
      const content = document.getElementById(`${tabName}-content`);
      if (content) content.classList.add('active');

      if (tabName === 'ai') {
        loadChats();
        if (Object.keys(chats).length === 0) {
          newChat();
        } else {
          const keys = Object.keys(chats);
          loadChat(keys[keys.length - 1]);
        }
        updateHistoryUI();
      }
    }

    // ================================================================
    // 🐱 WHISKER AI (whisker_ai_data.js'den)
    // ================================================================
    function getWhiskerAIResponse(userMessage) {
      if (typeof whiskerAIData === 'undefined' || !Array.isArray(whiskerAIData) || whiskerAIData.length === 0) {
        return 'Üzgünüm, şu anda yanıt veremiyorum. Lütfen daha sonra tekrar deneyin. 😿';
      }

      const cleanMsg = userMessage.toLowerCase().trim();
      if (!cleanMsg) {
        return 'Bir şey yazmadınız. Size nasıl yardımcı olabilirim? 😊';
      }

      // Basit yanıtlar
      if (cleanMsg.includes('nasılsın') || cleanMsg.includes('naber')) {
        return 'Ben bir yapay zeka asistanıyım, her zaman iyiyim! Siz nasılsınız? 😺';
      }
      if (cleanMsg === 'merhaba' || cleanMsg === 'selam') {
        return 'Merhaba! Size nasıl yardımcı olabilirim? 😊';
      }
      if (cleanMsg.includes('teşekkür')) {
        return 'Rica ederim! Ne zaman yardımcı olabilirim, buradayım. 🙏';
      }

      // whiskerAIData içinde arama
      let bestMatch = null;
      let bestScore = 0;

      for (const item of whiskerAIData) {
        if (!item.instruction || !item.output) continue;
        const instruction = item.instruction.toLowerCase();
        let score = 0;

        if (instruction === cleanMsg) score += 100;
        else if (cleanMsg.includes(instruction)) score += 50;
        else if (instruction.includes(cleanMsg)) score += 30;

        const words = cleanMsg.split(/\s+/);
        for (const word of words) {
          if (word.length > 2 && instruction.includes(word)) score += 10;
        }

        if (score > bestScore) {
          bestScore = score;
          bestMatch = item.output;
        }
      }

      if (bestMatch && bestScore >= 10) {
        return bestMatch;
      }

      return 'Üzgünüm, bu konuda henüz bir bilgim yok. Farklı bir şey sormak ister misiniz? 😿';
    }

    // ================================================================
    // 💬 AI CHAT FONKSİYONLARI
    // ================================================================
    let chats = {};
    let currentChatId = null;

    function loadChats() {
      try {
        const saved = localStorage.getItem('whisker_chats');
        if (saved) chats = JSON.parse(saved);
        else chats = {};
      } catch (e) { chats = {}; }
    }

    function saveChats() {
      try { localStorage.setItem('whisker_chats', JSON.stringify(chats)); } catch (e) {}
    }

    function getCurrentChatId() {
      if (!currentChatId || !chats[currentChatId]) {
        currentChatId = 'chat_' + Date.now();
        chats[currentChatId] = { id: currentChatId, messages: [], created: new Date().toISOString(), title: 'Yeni Sohbet' };
        saveChats();
      }
      return currentChatId;
    }

    function saveMessage(role, content) {
      const chatId = getCurrentChatId();
      chats[chatId].messages.push({ role, content, timestamp: new Date().toISOString() });
      if (chats[chatId].messages.length === 1 && role === 'user') {
        const title = content.length > 30 ? content.substring(0, 30) + '...' : content;
        chats[chatId].title = title;
      }
      saveChats();
    }

    function loadChat(chatId) {
      if (chats[chatId]) {
        currentChatId = chatId;
        const container = document.getElementById('aiMessages');
        if (!container) return;
        container.innerHTML = '';
        chats[chatId].messages.forEach(msg => {
          const div = document.createElement('div');
          div.className = `message ${msg.role}`;
          div.innerHTML = `<div class="message-bubble">${msg.content}</div>`;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
        updateHistoryUI();
      }
    }

    function newChat() {
      currentChatId = 'chat_' + Date.now();
      chats[currentChatId] = { id: currentChatId, messages: [], created: new Date().toISOString(), title: 'Yeni Sohbet' };
      saveChats();
      const container = document.getElementById('aiMessages');
      if (!container) return;
      container.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:20px;">
          <div style="font-size:80px;">🤖</div>
          <div style="font-size:32px;font-weight:700;color:#333;">WhiskerAI</div>
          <div style="font-size:16px;color:#666;max-width:400px;text-align:center;">Yeni bir sohbete başladınız. Bir soru sorun!</div>
        </div>
      `;
      updateHistoryUI();
    }

    function deleteChat(chatId) {
      if (chats[chatId]) {
        delete chats[chatId];
        saveChats();
        const keys = Object.keys(chats);
        if (keys.length > 0) loadChat(keys[keys.length - 1]);
        else newChat();
        updateHistoryUI();
      }
    }

    function updateHistoryUI() {
      const container = document.getElementById('chatHistoryList');
      if (!container) return;
      const keys = Object.keys(chats);
      if (keys.length === 0) {
        container.innerHTML = '<div class="no-history">Henüz sohbet yok</div>';
        return;
      }
      container.innerHTML = keys.map(key => {
        const chat = chats[key];
        const isActive = key === currentChatId;
        return `<div class="history-item ${isActive ? 'active' : ''}" onclick="loadChat('${key}')">
          ${chat.title}
          <span onclick="event.stopPropagation(); deleteChat('${key}')" style="margin-left:8px;color:#ff6b6b;cursor:pointer;">✕</span>
        </div>`;
      }).join('');
    }

    function handleAIMessage(event) {
      if (event.key === 'Enter') sendAIMessage();
    }

    async function sendAIMessage() {
      const input = document.getElementById('aiInput');
      if (!input) return;
      const message = input.value.trim();
      if (!message) return;

      const container = document.getElementById('aiMessages');
      if (!container) return;

      saveMessage('user', message);
      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.innerHTML = `<div class="message-bubble">${message}</div>`;
      container.appendChild(userDiv);
      input.value = '';

      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.innerHTML = '<div class="message-bubble">WhiskerAI düşünüyor...</div>';
      container.appendChild(aiDiv);
      container.scrollTop = container.scrollHeight;

      setTimeout(() => {
        const response = getWhiskerAIResponse(message);
        saveMessage('ai', response);
        aiDiv.innerHTML = `<div class="message-bubble">${response}</div>`;
        container.scrollTop = container.scrollHeight;
        updateHistoryUI();
      }, 300);
    }

    // ================================================================
    // 📌 ANA FONKSİYONLAR
    // ================================================================
    function handleAddress(event) {
      if (event.key === 'Enter') {
        const input = document.getElementById('addressInput');
        let url = input.value.trim();
        if (!url) return;
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        const isOwn = ownSites.some(site => url.includes(site));
        if (isOwn) loadPage(url);
        else window.open(url, '_blank', 'noopener,noreferrer');
      }
    }

    function loadPage(url) {
      const content = document.getElementById('browserContent');
      content.innerHTML = `<iframe class="page-frame" src="${url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`;
      document.getElementById('addressInput').value = url;
      history.push({ type: 'page', url: url });
      historyIndex = history.length - 1;
    }

    function goHome() {
      const content = document.getElementById('browserContent');
      content.innerHTML = `
        <div class="search-page">
          <div class="search-logo"><img src="1.png" alt="WhiskerSearch Logo" /></div>
          <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="WhiskerSearch'te ara..." onkeypress="handleSearch(event)" />
            <button class="search-button" onclick="performSearch()">Ara</button>
          </div>
        </div>
      `;
      document.getElementById('addressInput').value = 'https://ayse-create.github.io/WhiskerSearch';
      history = [];
      historyIndex = -1;
    }

    function goBack() {
      if (historyIndex > 0) {
        historyIndex--;
        const entry = history[historyIndex];
        if (entry.type === 'results') { lastSearchQuery = entry.query; showResults(); } 
        else if (entry.type === 'page') loadPage(entry.url);
      }
    }

    function goForward() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        const entry = history[historyIndex];
        if (entry.type === 'results') { lastSearchQuery = entry.query; showResults(); } 
        else if (entry.type === 'page') loadPage(entry.url);
      }
    }

    function handleSearch(event) {
      if (event.key === 'Enter') performSearch();
    }

    function performSearch() {
      const input = document.getElementById('searchInput');
      if (!input) return;
      const query = input.value;
      if (query.trim()) {
        lastSearchQuery = query;
        document.getElementById('addressInput').value = `https://ayse-create.github.io/WhiskerSearch/search?q=${encodeURIComponent(query)}`;
        showAlert();
      }
    }

    function showAlert() {
      document.getElementById('alertOverlay').style.display = 'flex';
    }

    function confirmAlert() {
      document.getElementById('alertOverlay').style.display = 'none';
      showResults();
    }

    function openResult() {
      window.open(canvaLink, '_blank', 'noopener,noreferrer');
    }

    // ================================================================
    // 🚀 BAŞLAT
    // ================================================================
    window.onload = function() {
      const addrInput = document.getElementById('addressInput');
      if (addrInput) addrInput.value = 'https://ayse-create.github.io/WhiskerSearch';
      if (typeof whiskerAIData !== 'undefined') {
        console.log(`✅ Whisker AI Data yüklendi: ${whiskerAIData.length} örnek`);
      }
      loadChats();
      if (Object.keys(chats).length === 0) newChat();
      console.log(`🐱 ${CONFIG.totalImages} görsel, 🎬 ${CONFIG.totalVideos} video hazır!`);
    };
  </script>
</body>
