<!doctype html>
<html lang="tr">
 <head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="hPq_WPZAvU4KE1qqk9TOxsd2XuAZEduUX5T1LQYAd-A" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="İnternette dolaşmanın yeni, sıradışı bir yolu. WhiskerSearch'te her gezinti farklı bir deneyim vaat ediyor... ya da belki etmiyor? Dene ve gör.">
  <title>WhiskerSearch🐱🔎</title>
  <link rel="icon" href="images/whiskersearch-tatli-arama.ico" type="image/x-icon" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .browser-container {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .demo-warning {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: #ffffff;
      padding: 12px 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .browser-header {
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .browser-buttons {
      display: flex;
      gap: 8px;
    }

    .nav-button {
      width: 32px;
      height: 32px;
      border: 1px solid #d0d0d0;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 16px;
      transition: all 0.2s;
    }

    .nav-button:hover {
      background: #e8e8e8;
    }

    .address-bar {
      flex: 1;
      background: #f0f0f0;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .address-bar-icon {
      color: #666;
      font-size: 14px;
      flex-shrink: 0;
    }

    .address-bar input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 6px 0;
      font-size: 13px;
      color: #333;
      outline: none;
      min-width: 50px;
    }

    .address-bar input::placeholder {
      color: #999;
    }

    .browser-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .search-page {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #fafafa 0%, #ffffff 100%);
    }

    .search-logo {
      width: 180px;
      height: 180px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounce 2s infinite;
    }

    .search-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .search-box {
      display: flex;
      width: 100%;
      max-width: 500px;
      margin-bottom: 30px;
    }

    .search-input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 50px 0 0 50px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-input:focus {
      border-color: #acd1fc;
    }

    .search-button {
      padding: 14px 28px;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      border: none;
      border-radius: 0 50px 50px 0;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .search-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .alert-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .alert-box {
      background: white;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.4s;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .alert-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: wobble 0.6s;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    .alert-title {
      font-size: 28px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }

    .alert-message {
      font-size: 16px;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .alert-button {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .alert-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .results-container {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: white;
    }

    .result-item {
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      border-left: 4px solid #FFD1E8;
      cursor: pointer;
      transition: all 0.3s;
    }

    .result-item:hover {
      background: #f0f0f0;
      transform: translateX(5px);
    }

    .result-url {
      font-size: 13px;
      color: #436691;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 18px;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .result-description {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    .result-content {
      flex: 1;
    }

    .ai-chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: white;
      padding: 20px 30px;
    }

    .ai-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
      max-height: 400px;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
    }

    .message.ai .message-bubble {
      background: #f0f0f0;
      color: #333;
    }

    .ai-input-area {
      display: flex;
      gap: 10px;
      border-top: 1px solid #e0e0e0;
      padding-top: 15px;
    }

    .ai-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .ai-input:focus {
      border-color: #D8C7FF;
    }

    .ai-send-button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .ai-send-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .tabs-container {
      display: flex;
      gap: 30px;
      padding: 15px 30px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      overflow-x: auto;
    }

    .tab {
      padding: 8px 0;
      border: none;
      background: none;
      color: #666;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .tab.active {
      color: #436691;
      border-bottom-color: #436691;
    }

    .tab:hover {
      color: #333;
    }

    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      padding: 20px 30px;
      background: white;
    }

    .image-item {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
      overflow: hidden;
    }

    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-item:hover {
      transform: scale(1.05);
      border-color: #cbd0d6;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .image-placeholder {
      font-size: 60px;
    }

    .videos-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px 30px;
      background: white;
    }

    .video-item {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      border-radius: 8px;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      overflow: hidden;
      position: relative;
    }

    .video-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.3);
    }

    .video-play-icon {
      position: absolute;
      font-size: 48px;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .shopping-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 20px 30px;
      background: white;
    }

    .product-item {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }

    .product-item:hover {
      border-color: #D8C7FF;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
    }

    .product-image {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .product-name {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 16px;
      color: #436691;
      font-weight: 700;
    }

    .tab-content {
      display: none;
      flex: 1;
      overflow-y: auto;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
    }

    iframe.page-frame {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
    }

    .ai-chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 15px;
    }

    .ai-chat-header h2 {
      font-size: 20px;
      color: #333;
      font-weight: 600;
    }

    .new-chat-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 14px;
    }

    .new-chat-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .chat-history-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 0;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      padding: 6px 12px;
      background: #f0f0f0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: #333;
      transition: all 0.2s;
      border: 1px solid #e0e0e0;
    }

    .history-item:hover {
      background: #e0e0e0;
      border-color: #D8C7FF;
    }

    .history-item.active {
      background: linear-gradient(135deg, #CFEFFF, #D8C7FF, #FFD1E8);
      color: white;
      border-color: #D8C7FF;
    }

    .no-history {
      color: #999;
      font-size: 14px;
      padding: 10px 0;
    }

    .loading-spinner {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 16px;
    }

    .shop-iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 500px;
    }

    .shop-iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      min-height: 500px;
    }
  </style>
 </head>
 <body>
  <div class="browser-container">
   <div class="demo-warning">
    ⚠️ Bu bir demo/tarayıcı simülasyonudur - Eğlence amaçlıdır
   </div>

   <div class="browser-header">
    <div class="browser-buttons">
      <button class="nav-button" onclick="goBack()" title="Geri">←</button>
      <button class="nav-button" onclick="goForward()" title="İleri">→</button>
      <button class="nav-button" onclick="goHome()" title="Ana Sayfa">↻</button>
    </div>
    <div class="address-bar">
      <span class="address-bar-icon">🔒</span>
      <input type="text" id="addressInput" value="https://ayse-create.github.io/WhiskerSearch" placeholder="URL girin..." onfocus="this.select()" onkeypress="handleAddress(event)" />
    </div>
   </div>

   <div class="browser-content" id="browserContent">
    <div class="search-page">
     <div class="search-logo">
      <img src="1.png" alt="WhiskerSearch Logo" />
     </div>
     <div class="search-box">
       <input type="text" class="search-input" id="searchInput" placeholder="WhiskerSearch'te ara..." onkeypress="handleSearch(event)" />
       <button class="search-button" onclick="performSearch()">Ara</button>
     </div>
    </div>
   </div>
  </div>

  <div class="alert-overlay" id="alertOverlay" style="display: none;">
   <div class="alert-box">
    <div class="alert-icon">🐱</div>
    <div class="alert-title">WhiskerSearch uyarısı!</div>
    <div class="alert-message">Bu arama sonuçları WhiskerSearch tarafından işlenmiştir. Devam etmek için tıklayın.</div>
    <button class="alert-button" onclick="confirmAlert()">Devam Et</button>
   </div>
  </div>

  <script src="whisker_ai_data.js"></script>

  <script>
    // ================================================================
    // 🔑 API KONFİGÜRASYONU - KENDİ API'LERİNİZ
    // ================================================================
    const API_CONFIG = {
      // Görsel API - 24 görsel
      images: {
        url: 'http://localhost:3000/api/cats',
        randomEndpoint: '/random',
        key: 'sk_test_benimilkanahtarim123'
      },
      // Video API - 9 video
      videos: {
        url: 'http://localhost:3000/api/videos',
        randomEndpoint: '/random',
        key: 'sk_test_video_anahtarim123'
      },
      // WhiskerShop Mini
      shop: {
        url: 'https://ayse-create.github.io/WhiskerShopMini'
      }
    };

    // ================================================================
    // 📸 GÖRSELLERİ API'DEN ÇEK
    // ================================================================
    async function loadImagesFromAPI() {
      try {
        const response = await fetch(`${API_CONFIG.images.url}?api_key=${API_CONFIG.images.key}`);
        if (!response.ok) throw new Error('Görsel listesi alınamadı');
        const data = await response.json();
        return data.images || [];
      } catch (error) {
        console.warn('Görsel API hatası:', error);
        return [];
      }
    }

    async function getRandomImage() {
      try {
        const response = await fetch(`${API_CONFIG.images.url}${API_CONFIG.images.randomEndpoint}?api_key=${API_CONFIG.images.key}`);
        if (!response.ok) throw new Error('Rastgele görsel alınamadı');
        const blob = await response.blob();
        return URL.createObjectURL(blob);
      } catch (error) {
        console.warn('Rastgele görsel hatası:', error);
        return null;
      }
    }

    // ================================================================
    // 🎬 VİDEOLARI API'DEN ÇEK
    // ================================================================
    async function loadVideosFromAPI() {
      try {
        const response = await fetch(`${API_CONFIG.videos.url}?api_key=${API_CONFIG.videos.key}`);
        if (!response.ok) throw new Error('Video listesi alınamadı');
        const data = await response.json();
        return data.videos || [];
      } catch (error) {
        console.warn('Video API hatası:', error);
        return [];
      }
    }

    async function getRandomVideo() {
      try {
        const response = await fetch(`${API_CONFIG.videos.url}${API_CONFIG.videos.randomEndpoint}?api_key=${API_CONFIG.videos.key}`);
        if (!response.ok) throw new Error('Rastgele video alınamadı');
        const blob = await response.blob();
        return URL.createObjectURL(blob);
      } catch (error) {
        console.warn('Rastgele video hatası:', error);
        return null;
      }
    }

    // ================================================================
    // 🏪 ALIŞVERİŞ - WhiskerShopMini
    // ================================================================
    function loadShop() {
      const shopUrl = API_CONFIG.shop.url;
      return `
        <div class="shop-iframe-container">
          <iframe src="${shopUrl}" 
                  sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
                  loading="lazy"
                  allow="autoplay; encrypted-media"
                  title="WhiskerShop Mini">
          </iframe>
        </div>
      `;
    }

    // ================================================================
    // 📊 TAB İÇERİKLERİNİ OLUŞTURMA
    // ================================================================
    function buildImagesGrid(images) {
      if (!images || images.length === 0) {
        return `
          <div class="loading-spinner">
            <div>🐱 Görseller yükleniyor...</div>
            <div style="font-size: 12px; color: #999; margin-top: 10px;">API'den çekiliyor: ${API_CONFIG.images.url}</div>
          </div>
        `;
      }

      return `
        <div class="images-grid">
          ${images.map(img => `
            <div class="image-item" onclick="openImage('${img.filename}')">
              <img src="${API_CONFIG.images.url}/${encodeURIComponent(img.filename)}?api_key=${API_CONFIG.images.key}" 
                   alt="${img.filename}" 
                   loading="lazy"
                   onerror="this.parentElement.innerHTML='<span class=\\'image-placeholder\\'>🐱</span>'">
            </div>
          `).join('')}
        </div>
      `;
    }

    function buildVideosGrid(videos) {
      if (!videos || videos.length === 0) {
        return `
          <div class="loading-spinner">
            <div>🎬 Videolar yükleniyor...</div>
            <div style="font-size: 12px; color: #999; margin-top: 10px;">API'den çekiliyor: ${API_CONFIG.videos.url}</div>
          </div>
        `;
      }

      return `
        <div class="videos-container">
          ${videos.map(video => `
            <div class="video-item" onclick="openVideo('${video.filename}')">
              <video src="${API_CONFIG.videos.url}/${encodeURIComponent(video.filename)}?api_key=${API_CONFIG.videos.key}" 
                     muted 
                     loop 
                     preload="metadata"
                     onmouseover="this.play()"
                     onmouseout="this.pause(); this.currentTime=0;"
                     onerror="this.parentElement.innerHTML='<span class=\\'video-play-icon\\'>🎬</span>'">
              </video>
              <span class="video-play-icon">▶️</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ================================================================
    // 🖱️ TIKLAMA İŞLEMLERİ
    // ================================================================
    function openImage(filename) {
      const url = `${API_CONFIG.images.url}/${encodeURIComponent(filename)}?api_key=${API_CONFIG.images.key}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    function openVideo(filename) {
      const url = `${API_CONFIG.videos.url}/${encodeURIComponent(filename)}?api_key=${API_CONFIG.videos.key}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    // ================================================================
    // 🔄 SONUÇLARI GÖSTER (GÜNCELLENMİŞ)
    // ================================================================
    let cachedImages = [];
    let cachedVideos = [];

    function showResults() {
      const content = document.getElementById('browserContent');
      const query = lastSearchQuery;

      content.innerHTML = `
        <div style="display: flex; align-items: center; padding: 20px 30px; background: #f9f9f9; border-bottom: 1px solid #e0e0e0;">
          <div class="search-box" style="max-width: 600px; margin: 0;">
            <input type="text" class="search-input" value="${query}" onkeypress="handleSearch(event)" style="max-width: none;" />
            <button class="search-button" onclick="performSearch()">Ara</button>
          </div>
        </div>

        <div class="tabs-container">
          <button class="tab active" onclick="switchTab('all')">🔍 Tümü</button>
          <button class="tab" onclick="switchTab('images')">🖼️ Görseller</button>

          <button class="tab" onclick="switchTab('shopping')">🛍️ Alışveriş</button>
          <button class="tab" onclick="switchTab('ai')">✨ AI Modu</button>
        </div>

        <div id="all-content" class="tab-content active">
          <div class="results-container">
            <div style="margin-bottom: 10px; color: #999; font-size: 14px;">Sonuçlar: "${query}" için</div>

              <div class="result-content">
                <div class="result-url">whiskersearch.com › arama › ${query}</div>
                <div class="result-title">WhiskerSearch'ın En İyi Sonucu</div>
                <div class="result-description">WhiskerSearch sizin için özel olarak seçtiği bu kaynağı incelemenizi tavsiye eder.</div>
              </div>
            </div>
            <div class="result-item" onclick="openResult()">
              <div class="result-content">
                <div class="result-url">whiskersearch.com › sonuç › ${query}</div>
                <div class="result-title">Başka Bir WhiskerSearch Önerisi</div>
                <div class="result-description">WhiskerSearch'ın dış dünyaya bakışını sizin de deneyimlemenizi çok isterim.</div>
              </div>
            </div>
            <div class="result-item" onclick="openResult()">
              <div class="result-content">
                <div class="result-url">whiskersearch.com › tavsiye › ${query}</div>
                <div class="result-title">WhiskerSearch'ın Özel Seçimi</div>
                <div class="result-description">Bu bağlantı WhiskerSearch tarafından titizlikle incelendi ve onaylandı!</div>
              </div>
            </div>
          </div>
        </div>

        <div id="images-content" class="tab-content">
          <div id="imagesGridContainer">
            <div class="loading-spinner">🐱 Görseller yükleniyor...</div>
          </div>
        </div>

        <div id="videos-content" class="tab-content">
          <div id="videosGridContainer">
            <div class="loading-spinner">🎬 Videolar yükleniyor...</div>
          </div>
        </div>

        <div id="shopping-content" class="tab-content">
          ${loadShop()}
        </div>

        <div id="ai-content" class="tab-content">
          <div class="ai-chat-container">
            <div class="ai-chat-header">
              <h2>🤖 WhiskerAI</h2>
              <div>
                <button class="new-chat-btn" onclick="newChat()">➕ Yeni Sohbet</button>
              </div>
            </div>
            <div id="chatHistoryList" class="chat-history-list"></div>
            <div class="ai-messages" id="aiMessages"></div>
            <div class="ai-input-area">
              <input type="text" class="ai-input" id="aiInput" placeholder="Bir soru sor..." onkeypress="handleAIMessage(event)" />
              <button class="ai-send-button" onclick="sendAIMessage()">Gönder</button>
            </div>
          </div>
        </div>
      `;

      history.push({ type: 'results', query: query });
      historyIndex = history.length - 1;

      // Görselleri yükle
      loadImagesFromAPI().then(images => {
        cachedImages = images;
        const container = document.getElementById('imagesGridContainer');
        if (container) {
          container.innerHTML = buildImagesGrid(images);
        }
      });

      // Videoları yükle
      loadVideosFromAPI().then(videos => {
        cachedVideos = videos;
        const container = document.getElementById('videosGridContainer');
        if (container) {
          container.innerHTML = buildVideosGrid(videos);
        }
      });

      // AI Modunu yükle
      loadChats();
      if (Object.keys(chats).length === 0) {
        newChat();
      } else {
        const keys = Object.keys(chats);
        loadChat(keys[keys.length - 1]);
      }
      updateHistoryUI();

      setTimeout(() => {
        const aiInput = document.getElementById('aiInput');
        if (aiInput) aiInput.focus();
      }, 100);
    }

    // ================================================================
    // 🐱 WHISKER AI DATA İLE GERÇEK CEVAP SİSTEMİ
    // ================================================================

    function getWhiskerAIResponse(userMessage) {
      if (typeof whiskerAIData === 'undefined' || !Array.isArray(whiskerAIData) || whiskerAIData.length === 0) {
        return 'Üzgünüm, şu anda yanıt veremiyorum. Lütfen daha sonra tekrar deneyin. 😿';
      }

      const cleanMsg = userMessage.toLowerCase().trim();
      if (!cleanMsg) {
        return 'Bir şey yazmadınız. Size nasıl yardımcı olabilirim? 😊';
      }

      const generalResponses = {
        'merhaba': 'Merhaba! Size nasıl yardımcı olabilirim? 😊',
        'selam': 'Selam! Hoş geldiniz. Size nasıl yardımcı olabilirim? 🐱',
        'teşekkürler': 'Rica ederim! Ne zaman yardımcı olabilirim, buradayım. 🙏',
        'sağol': 'Rica ederim! Ne zaman yardımcı olabilirim, buradayım. 🙏',
        'iyi günler': 'İyi günler! Size yardımcı olmaktan mutluluk duyarım. ☀️'
      };

      const statusResponses = {
        'iyiyim': 'Ne güzel! İyi olmanıza çok sevindim. Size nasıl yardımcı olabilirim? 😊',
        'kötüyüm': 'Üzgünüm duyduğuma. Size nasıl yardımcı olabilirim? Belki konuşmak iyi gelir. 🐱',
        'fena değil': 'Fena değil olmanız iyi. Size nasıl yardımcı olabilirim? 😺',
        'çok iyiyim': 'Harika! Çok iyi olmanıza sevindim. Size nasıl yardımcı olabilirim? 🎉'
      };

      if (cleanMsg.includes('nasılsın') || cleanMsg.includes('nasıl sın') || cleanMsg.includes('naber')) {
        return 'Ben bir yapay zeka asistanıyım, her zaman iyiyim! Siz nasılsınız? 😺';
      }

      for (const [key, response] of Object.entries(statusResponses)) {
        if (cleanMsg.includes(key) || cleanMsg === key) {
          return response;
        }
      }

      for (const [key, response] of Object.entries(generalResponses)) {
        if (cleanMsg.includes(key)) {
          return response;
        }
      }

      let bestMatch = null;
      let bestScore = 0;

      for (const item of whiskerAIData) {
        if (!item.instruction || !item.output) continue;
        const instruction = item.instruction.toLowerCase();
        let score = 0;

        if (instruction === cleanMsg) score += 100;
        else if (cleanMsg.includes(instruction)) score += 50;
        else if (instruction.includes(cleanMsg)) score += 30;

        const words = cleanMsg.split(/\s+/);
        for (const word of words) {
          if (word.length > 2 && instruction.includes(word)) score += 10;
        }

        const brands = ['whiskerhub', 'whiskersearch', 'whiskershop', 'whiskercalc', 'cat-desktop', 'whiskerterminal'];
        for (const brand of brands) {
          if (cleanMsg.includes(brand) && instruction.includes(brand)) score += 20;
        }

        if (score > bestScore) {
          bestScore = score;
          bestMatch = item.output;
        }
      }

      if (bestMatch && bestScore >= 10) {
        return bestMatch;
      }

      return 'Üzgünüm, bu konuda henüz bir bilgim yok. Farklı bir şey sormak ister misiniz? 😿';
    }

    // ================================================================
    // 💬 AI CHAT FONKSİYONLARI
    // ================================================================
    let chats = {};
    let currentChatId = null;

    function loadChats() {
      try {
        const saved = localStorage.getItem('whisker_chats');
        if (saved) {
          chats = JSON.parse(saved);
        } else {
          chats = {};
        }
      } catch (e) {
        chats = {};
      }
    }

    function saveChats() {
      try {
        localStorage.setItem('whisker_chats', JSON.stringify(chats));
      } catch (e) {
        console.warn('Chat kaydedilemedi:', e);
      }
    }

    function getCurrentChatId() {
      if (!currentChatId || !chats[currentChatId]) {
        currentChatId = 'chat_' + Date.now();
        chats[currentChatId] = {
          id: currentChatId,
          messages: [],
          created: new Date().toISOString(),
          title: 'Yeni Sohbet'
        };
        saveChats();
      }
      return currentChatId;
    }

    function saveMessage(role, content) {
      const chatId = getCurrentChatId();
      chats[chatId].messages.push({ role, content, timestamp: new Date().toISOString() });
      if (chats[chatId].messages.length === 1 && role === 'user') {
        const title = content.length > 30 ? content.substring(0, 30) + '...' : content;
        chats[chatId].title = title;
      }
      saveChats();
    }

    function loadChat(chatId) {
      if (chats[chatId]) {
        currentChatId = chatId;
        const container = document.getElementById('aiMessages');
        if (!container) return;
        container.innerHTML = '';
        
        chats[chatId].messages.forEach(msg => {
          const div = document.createElement('div');
          div.className = `message ${msg.role}`;
          div.innerHTML = `<div class="message-bubble">${msg.content}</div>`;
          container.appendChild(div);
        });
        
        container.scrollTop = container.scrollHeight;
        updateHistoryUI();
      }
    }

    function newChat() {
      currentChatId = 'chat_' + Date.now();
      chats[currentChatId] = {
        id: currentChatId,
        messages: [],
        created: new Date().toISOString(),
        title: 'Yeni Sohbet'
      };
      saveChats();
      
      const container = document.getElementById('aiMessages');
      if (!container) return;
      container.innerHTML = `
        <div style="display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 20px;">
          <div style="font-size: 80px;">🤖</div>
          <div style="font-size: 32px; font-weight: 700; color: #333;">WhiskerAI</div>
          <div style="font-size: 16px; color: #666; max-width: 400px; text-align: center;">Yeni bir sohbete başladınız. Bir soru sorun!</div>
        </div>
      `;
      updateHistoryUI();
    }

    function deleteChat(chatId) {
      if (chats[chatId]) {
        delete chats[chatId];
        saveChats();
        const keys = Object.keys(chats);
        if (keys.length > 0) {
          loadChat(keys[keys.length - 1]);
        } else {
          newChat();
        }
        updateHistoryUI();
      }
    }

    function updateHistoryUI() {
      const container = document.getElementById('chatHistoryList');
      if (!container) return;
      
      const keys = Object.keys(chats);
      if (keys.length === 0) {
        container.innerHTML = '<div class="no-history">Henüz sohbet yok</div>';
        return;
      }
      
      container.innerHTML = keys.map(key => {
        const chat = chats[key];
        const isActive = key === currentChatId;
        return `<div class="history-item ${isActive ? 'active' : ''}" onclick="loadChat('${key}')">
          ${chat.title}
          <span onclick="event.stopPropagation(); deleteChat('${key}')" style="margin-left: 8px; color: #ff6b6b; cursor: pointer;">✕</span>
        </div>`;
      }).join('');
    }

    function handleAIMessage(event) {
      if (event.key === 'Enter') {
        sendAIMessage();
      }
    }

    async function sendAIMessage() {
      const input = document.getElementById('aiInput');
      if (!input) return;
      const message = input.value.trim();
      if (!message) return;

      const container = document.getElementById('aiMessages');
      if (!container) return;

      saveMessage('user', message);

      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.innerHTML = `<div class="message-bubble">${message}</div>`;
      container.appendChild(userDiv);

      input.value = '';

      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.innerHTML = '<div class="message-bubble">WhiskerAI düşünüyor...</div>';
      container.appendChild(aiDiv);
      container.scrollTop = container.scrollHeight;

      setTimeout(() => {
        const response = getWhiskerAIResponse(message);
        saveMessage('ai', response);
        aiDiv.innerHTML = `<div class="message-bubble">${response}</div>`;
        container.scrollTop = container.scrollHeight;
        updateHistoryUI();
      }, 300);
    }

    // ================================================================
    // 📌 ANA FONKSİYONLAR
    // ================================================================
    let lastSearchQuery = '';
    let canvaLink = 'https://www.canva.com/design/DAGrke6nXUY/OdOciaHr0CxE1haEmn-IeA/view?utm_content=DAGrke6nXUY&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h31ec2b4051';
    let history = [];
    let historyIndex = -1;
    const ownSites = ['ayse-create.github.io', 'professorcatsearch.com', 'whiskersearch.com'];

    function handleAddress(event) {
      if (event.key === 'Enter') {
        const input = document.getElementById('addressInput');
        let url = input.value.trim();
        if (!url) return;
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        const isOwn = ownSites.some(site => url.includes(site));
        if (isOwn) {
          loadPage(url);
        } else {
          window.open(url, '_blank', 'noopener,noreferrer');
        }
      }
    }

    function loadPage(url) {
      const content = document.getElementById('browserContent');
      content.innerHTML = `
        <iframe class="page-frame" src="${url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      `;
      document.getElementById('addressInput').value = url;
      history.push({ type: 'page', url: url });
      historyIndex = history.length - 1;
    }

    function goHome() {
      const content = document.getElementById('browserContent');
      content.innerHTML = `
        <div class="search-page">
          <div class="search-logo">
            <img src="1.png" alt="WhiskerSearch Logo" />
          </div>
          <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="WhiskerSearch'te ara..." onkeypress="handleSearch(event)" />
            <button class="search-button" onclick="performSearch()">Ara</button>
          </div>
        </div>
      `;
      document.getElementById('addressInput').value = 'https://ayse-create.github.io/WhiskerSearch';
      history = [];
      historyIndex = -1;
    }

    function goBack() {
      if (historyIndex > 0) {
        historyIndex--;
        const entry = history[historyIndex];
        if (entry.type === 'results') {
          lastSearchQuery = entry.query;
          showResults();
        } else if (entry.type === 'page') {
          loadPage(entry.url);
        }
      }
    }

    function goForward() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        const entry = history[historyIndex];
        if (entry.type === 'results') {
          lastSearchQuery = entry.query;
          showResults();
        } else if (entry.type === 'page') {
          loadPage(entry.url);
        }
      }
    }

    function handleSearch(event) {
      if (event.key === 'Enter') {
        performSearch();
      }
    }

    function performSearch() {
      const input = document.getElementById('searchInput');
      if (!input) return;
      const query = input.value;
      if (query.trim()) {
        lastSearchQuery = query;
        document.getElementById('addressInput').value = `https://ayse-create.github.io/WhiskerSearch/search?q=${encodeURIComponent(query)}`;
        showAlert();
      }
    }

    function showAlert() {
      document.getElementById('alertOverlay').style.display = 'flex';
    }

    function confirmAlert() {
      document.getElementById('alertOverlay').style.display = 'none';
      showResults();
    }

    function openResult() {
      window.open(canvaLink, '_blank', 'noopener,noreferrer');
    }

    function switchTab(tabName) {
      const tabs = document.querySelectorAll('.tab');
      const contents = document.querySelectorAll('.tab-content');
      tabs.forEach(t => t.classList.remove('active'));
      contents.forEach(c => c.classList.remove('active'));
      
      const tabMap = { 'all': 'Tümü', 'images': 'Görseller', 'videos': 'Videolar', 'shopping': 'Alışveriş', 'ai': 'AI Modu' };
      const activeTab = Array.from(tabs).find(t => t.textContent.includes(tabMap[tabName]));
      if (activeTab) activeTab.classList.add('active');
      
      const content = document.getElementById(`${tabName}-content`);
      if (content) content.classList.add('active');

      if (tabName === 'ai') {
        loadChats();
        if (Object.keys(chats).length === 0) {
          newChat();
        } else {
          const keys = Object.keys(chats);
          loadChat(keys[keys.length - 1]);
        }
        updateHistoryUI();
      }
    }

    window.onload = function() {
      const addrInput = document.getElementById('addressInput');
      if (addrInput) addrInput.value = 'https://ayse-create.github.io/WhiskerSearch';
      if (typeof whiskerAIData !== 'undefined') {
        console.log(`✅ Whisker AI Data yüklendi: ${whiskerAIData.length} örnek`);
      }
      loadChats();
      if (Object.keys(chats).length === 0) {
        newChat();
      }
    };
  </script>
